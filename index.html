<script>
'use strict';
/* ========= Costanti ========= */
const H = 216, GROUND = 176, STEP = 1 / 60;
const RUN = 112, GRAV = 900, JUMP_V = -335, COYOTE = 0.11, BUFFER = 0.13, FOLLOW_DELAY = 26;
const C = { pink:'#ff2e7e', yellow:'#ffd23f', cyan:'#38d6d0', ink:'#17101c', paper:'#fff6e0', red:'#e8344e', white:'#ffffff' };

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 320;

/* ========= Font bitmap 5x7 ========= */
const FONT = {
A:'0E11111F111111',B:'1E11111E11111E',C:'0E11101010110E',D:'1E11111111111E',E:'1F10101E10101F',F:'1F10101E101010',
G:'0E11101711110F',H:'1111111F111111',I:'0E04040404040E',J:'0702020202120C',K:'11121418141211',L:'1010101010101F',
M:'111B1515111111',N:'11111915131111',O:'0E11111111110E',P:'1E11111E101010',Q:'0E11111115120D',R:'1E11111E141211',
S:'0F10100E01011E',T:'1F040404040404',U:'1111111111110E',V:'11111111110A04',W:'1111111515150A',X:'11110A040A1111',
Y:'11110A04040404',Z:'1F01020408101F','0':'0E11131519110E','1':'040C040404040E','2':'0E11010204081F','3':'1F02040201110E',
'4':'02060A121F0202','5':'1F101E0101110E','6':'0608101E11110E','7':'1F010204080808','8':'0E11110E11110E','9':'0E11110F01020C',
'.':'00000000000C0C',',':'000000000C0408','!':'04040404040004','?':'0E110102040004',':':'000C0C000C0C00','-':'0000001F000000',
"'":'04040800000000','€':'07081E081E0807','+':'0004041F040400','/':'01010204081010','(':'02040808080402',')':'08040202020408',' ':'00000000000000'
};
const ACCENTS = { 'À':'A`','È':'E`','É':'E´','Ì':'I`','Ò':'O`','Ù':'U`' };
function textW(s, k = 1) { return s.length * 6 * k - k; }
function text(s, x, y, col = C.white, k = 1, g = ctx) {
  s = String(s).toUpperCase(); g.fillStyle = col; x = Math.round(x); y = Math.round(y);
  for (const raw of s) {
    const acc = ACCENTS[raw]; const ch = acc ? acc[0] : raw; const hex = FONT[ch];
    if (hex) for (let r = 0; r < 7; r++) {
      const bits = parseInt(hex.substr(r * 2, 2), 16);
      for (let b = 0; b < 5; b++) if (bits & (16 >> b)) g.fillRect(x + b * k, y + r * k, k, k);
    }
    if (acc) { const dx = acc[1] === '`' ? 1 : 3; g.fillRect(x + dx * k, y - 2 * k, k, k); g.fillRect(x + 2 * k, y - k, k, k); }
    x += 6 * k;
  }
}
function textS(s, x, y, col, k = 1, sh = C.ink) { text(s, x + k, y + k, sh, k); text(s, x, y, col, k); }
function textC(s, y, col, k = 1, sh) { const x = (W - textW(s, k)) / 2; sh ? textS(s, x, y, col, k, sh) : text(s, x, y, col, k); }

/* ========= Sprite ========= */
function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d')); return c; }
function rows(g, list, pal, ox = 0, oy = 0) {
  list.forEach((row, y) => { for (let x = 0; x < row.length; x++) { const col = pal[row[x]]; if (col) { g.fillStyle = col; g.fillRect(ox + x, oy + y, 1, 1); } } });
}
const r = (g, col, x, y, w = 1, h = 1) => { g.fillStyle = col; g.fillRect(x, y, w, h); };

const SKIN = '#f2b48c', SKIN_D = '#d48c68';
const GIBI_PAL = { H:'#14121a', h:'#37333f', K:'#0a0a10', L:'#6fb7c9', G:'#e8bd3f', S:SKIN, s:SKIN_D, W:'#ffffff', E:'#3f9fe2', r:'#b9c0c8', P:'#e88f80', M:'#fff4dc', m:'#b23a44' };
const GIBI_HEAD = [
  '......hHHh......',
  '.....HHHHHH.....',
  '......HHHH......',
  '..GKLLKGKLLKG...',
  '...HHHHHHHHHH...',
  '..HHhhHHHHHHHH..',
  '..HHSSSSSSSSSH..',
  '..HSSSSSSSSSSS..',
  '..HSSWESSSWESS..',
  '..rSSWESSSWESS..',
  '...SPSSSSsSSPS..',
  '...SSSmMMMMmSS..',
  '....SSSSSSSSS...',
];
const LUI_PAL = { x:'#1e1a1c', X:'#3a3236', S:SKIN, s:SKIN_D, D:'#1e1a1c', W:'#ffffff', K:'#20140e', b:'#2a2422', g:'#a8a4a0', M:'#c8626a' };
const LUI_HEAD = [
  '...x.xx.xx.x....',
  '..xxxxxxxxxxx...',
  '.xxxXxxxxXxxxx..',
  '.xxxxxxxxxxxxx..',
  '..xxxSSSSSSxxx..',
  '..xxSSSSSSSSS...',
  '..xSSDDSSSDDS...',
  '..SSSWKSSSWKS...',
  '..SSSSSSsSSSS...',
  '..bSbbbbbbbbS...',
  '..bbbbMMMbbbb...',
  '...bbbggggbb....',
  '....bbggggb.....',
];

function legs(g, f, skin, boot, lace) {
  const leg = (x, top, bot) => { r(g, skin, x, top, 2, bot - top); r(g, boot, x, bot, 3, 2); if (lace) r(g, lace, x + 1, bot, 1, 1); };
  if (f === 'idle') { leg(6, 21, 24); leg(9, 21, 24); }
  else if (f === 0) { leg(4, 21, 23); leg(10, 21, 24); }
  else if (f === 1) { leg(7, 21, 24); leg(8, 21, 23); }
  else if (f === 2) { leg(10, 21, 23); leg(4, 21, 24); }
  else if (f === 3) { leg(8, 21, 24); leg(7, 21, 23); }
  else { leg(4, 21, 23); leg(10, 21, 22); }
}
function gibiFrame(f) {
  return mk(16, 26, g => {
    rows(g, GIBI_HEAD, GIBI_PAL);
    r(g, SKIN, 7, 13, 3, 1);
    r(g, '#2b1b26', 5, 14, 7, 5); r(g, '#43303a', 6, 15, 1, 3);
    r(g, '#0e0e12', 6, 13, 5, 1);                 // collanina
    r(g, '#e6e0d4', 8, 14, 1, 1);                 // ciondolo
    r(g, C.red, 10, 16, 1, 1); r(g, C.yellow, 10, 17, 1, 1);
    r(g, SKIN, 3, 14, 2, 4);                      // braccio dietro
    const by = f === 'jump' ? 14 : (f === 1 || f === 3 ? 16 : 15);   // la tote bag ondeggia mentre corre
    r(g, '#cfc4a6', 4, 13, 1, 2); r(g, '#cfc4a6', 3, 15, 1, 1);
    r(g, '#efe6cf', 0, by, 5, 6); r(g, '#cfc4a6', 0, by + 5, 5, 1);
    r(g, C.ink, 1, by + 2, 3, 2); r(g, C.pink, 2, by + 2, 1, 1);
    r(g, SKIN, 12, 14, 2, 5);                     // braccio tatuato
    r(g, '#35466f', 12, 14, 1, 1); r(g, '#35466f', 13, 15, 1, 1); r(g, '#35466f', 12, 16, 2, 1); r(g, C.red, 13, 17, 1, 1);
    r(g, '#0d0d12', 5, 19, 7, 2);                 // shorts
    r(g, '#c9ced6', 5, 19, 1, 1); r(g, '#c9ced6', 8, 19, 1, 1); r(g, '#c9ced6', 11, 19, 1, 1); // borchie
    legs(g, f, '#3b3244', '#14131a', C.pink);     // calze scure e anfibi con lacci rosa
  });
}
function luiFrame(f) {
  return mk(16, 26, g => {
    rows(g, LUI_HEAD, LUI_PAL);
    r(g, '#23262e', 5, 13, 7, 7); r(g, '#3a3f4c', 7, 15, 3, 2);
    r(g, SKIN, 3, 14, 2, 4);
    r(g, SKIN, 12, 14, 2, 3); r(g, '#14141a', 12, 17, 2, 1);   // bracciali
    r(g, SKIN, 12, 18, 2, 1); r(g, '#f0641e', 14, 15, 2, 4);   // telefono arancione
    r(g, '#2f3a54', 5, 20, 7, 1);
    legs(g, f, '#2f3a54', '#d9d4c8', null);
  });
}
const FRAMES = ['idle', 0, 1, 2, 3, 'jump'];
const GIBI = Object.fromEntries(FRAMES.map(f => [f, gibiFrame(f)]));
const LUI = Object.fromEntries(FRAMES.map(f => [f, luiFrame(f)]));

/* Mestierate: i prezzi assurdi prendono vita */
function eyes(g, x, y, gap) { r(g, '#fff', x, y, 3, 3); r(g, '#fff', x + gap, y, 3, 3); r(g, C.ink, x + 1, y + 1, 2, 2); r(g, C.ink, x + gap + 1, y + 1, 2, 2); r(g, C.ink, x, y - 1, 3, 1); r(g, C.ink, x + gap, y - 1, 3, 1); }
function enemySprite(kind, step) {
  return mk(18, 20, g => {
    if (kind === 'birra') {
      r(g, '#fff', 3, 0, 12, 4); r(g, '#fff', 2, 2, 14, 2);
      r(g, '#f2a81d', 3, 4, 12, 12); r(g, '#ffc94a', 4, 5, 2, 10); r(g, '#b8740c', 14, 4, 1, 12);
      r(g, 'rgba(255,255,255,.75)', 15, 6, 3, 1); r(g, 'rgba(255,255,255,.75)', 17, 6, 1, 6); r(g, 'rgba(255,255,255,.75)', 15, 12, 3, 1);
      eyes(g, 5, 7, 5); r(g, C.ink, 7, 13, 4, 1);
    } else if (kind === 'panino') {
      r(g, '#d99a48', 3, 2, 12, 2); r(g, '#d99a48', 1, 4, 16, 3); r(g, '#f6d9a0', 5, 3, 1, 1); r(g, '#f6d9a0', 10, 3, 1, 1); r(g, '#f6d9a0', 13, 5, 1, 1);
      r(g, '#5fbf4a', 0, 7, 18, 2); r(g, '#b83a38', 1, 9, 16, 2); r(g, '#f4d24a', 2, 11, 14, 1);
      r(g, '#c9863a', 1, 12, 16, 4); eyes(g, 5, 4, 5); r(g, C.ink, 7, 14, 4, 1);
    } else if (kind === 'gelato') {
      r(g, '#ff8fb8', 3, 0, 12, 7); r(g, '#ff8fb8', 2, 2, 14, 5); r(g, '#ffd0e0', 5, 1, 3, 2);
      r(g, '#e0a858', 3, 7, 12, 3); r(g, '#e0a858', 4, 10, 10, 2); r(g, '#e0a858', 5, 12, 8, 2); r(g, '#e0a858', 6, 14, 6, 2);
      r(g, '#b57f3c', 6, 8, 1, 1); r(g, '#b57f3c', 11, 8, 1, 1); r(g, '#b57f3c', 8, 11, 1, 1);
      eyes(g, 5, 3, 5); r(g, C.ink, 7, 9, 4, 1);
    } else {
      r(g, '#1e55c8', 1, 0, 16, 16); r(g, '#fff', 2, 1, 14, 14); r(g, '#1e55c8', 3, 2, 12, 12);
      r(g, '#fff', 5, 3, 2, 10); r(g, '#fff', 7, 3, 5, 1); r(g, '#fff', 7, 7, 5, 1); r(g, '#fff', 11, 4, 2, 3);
      eyes(g, 3, 9, 8);
    }
    const a = step ? 16 : 17, b = step ? 17 : 16;
    r(g, C.ink, 5, 16, 2, a - 14); r(g, C.ink, 11, 16, 2, b - 14);
    r(g, C.ink, 4, a + 2, 3, 1); r(g, C.ink, 10, b + 2, 3, 1);
  });
}
const ENEMY = {}; ['birra', 'panino', 'parcheggio', 'gelato'].forEach(k => ENEMY[k] = [enemySprite(k, 0), enemySprite(k, 1)]);
const PRICE = { birra: 9, panino: 12, parcheggio: 15, gelato: 6 };
const WATER = mk(8, 13, g => { r(g, '#fff', 3, 0, 2, 2); r(g, '#bfefff', 2, 2, 4, 1); r(g, '#58c4ec', 1, 3, 6, 9); r(g, '#e6fbff', 2, 4, 1, 6); r(g, '#fff', 1, 6, 6, 2); r(g, '#2d8fc0', 1, 12, 6, 1); });
const GIBI_FACE = mk(16, 13, g => rows(g, GIBI_HEAD, GIBI_PAL));

const PICK = mk(9, 10, g => rows(g, ['..#####..', '.#yyyyy#.', '#yyyyyyy#', '#yyWyyyy#', '#yyyyyyy#', '.#yyyyy#.', '.#yyyyy#.', '..#yyy#..', '...#y#...', '....#....'],
  { '#': C.ink, y: C.yellow, W: '#fff' }));

function drawCar(g, x, y, w, h, col, dim) {
  const dark = dim ? 'rgba(20,10,30,.25)' : 'rgba(20,10,30,.28)';
  r(g, col, x + 3, y, w - 6, h - 12); r(g, col, x, y + h - 14, w, 10);
  r(g, 'rgba(255,255,255,.35)', x + 3, y, w - 6, 1);
  r(g, '#bfe6ef', x + 6, y + 2, (w - 16) / 2, h - 16); r(g, '#bfe6ef', x + 9 + (w - 16) / 2, y + 2, (w - 16) / 2 - 1, h - 16);
  r(g, 'rgba(255,255,255,.6)', x + 8, y + 3, 2, 2);
  r(g, dark, x, y + h - 7, w, 3); r(g, C.yellow, x + w - 3, y + h - 12, 3, 2); r(g, C.red, x, y + h - 12, 2, 2);
  [x + 8, x + w - 15].forEach(wx => { r(g, '#121016', wx, y + h - 7, 8, 7); r(g, '#8a8a92', wx + 3, y + h - 4, 2, 2); });
}

/* ========= Sfondi ========= */
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const BG_FAR = mk(640, H, g => {
  // colline toscane, cipressi e la cupola
  const hill = (base, amp, col, f) => { g.fillStyle = col; for (let x = 0; x < 640; x++) { const y = base + Math.round(Math.sin(x * 2 * Math.PI / 640 * f) * amp + Math.sin(x * 2 * Math.PI / 640 * f * 3) * amp * .3); g.fillRect(x, y, 1, 200 - y); } };
  hill(120, 12, '#c9a8b8', 2);
  // cupola
  const d = '#a8768c', cx = 420;
  r(g, d, cx - 2, 76, 4, 6); r(g, d, cx - 5, 82, 10, 3);
  for (let i = 0; i < 20; i++) { const w = Math.round(Math.sqrt(1 - (i / 20) ** 2) * 18); r(g, d, cx - w, 105 - i, w * 2, 1); }
  r(g, d, cx - 22, 105, 44, 25); r(g, d, cx + 30, 88, 8, 40); r(g, d, cx - 42, 112, 20, 20);
  hill(136, 9, '#a58c8e', 3);
  for (let i = 0; i < 26; i++) { const x = Math.floor(rnd() * 640), hgt = 12 + Math.floor(rnd() * 12), b = 142 + Math.floor(rnd() * 8); for (let j = 0; j < hgt; j++) { const w = Math.max(1, Math.round(3 * Math.sin(Math.PI * (j + 1) / (hgt + 1)))); r(g, '#55655a', x - w, b - j, w * 2, 1); } }
});
const BG_MID = mk(512, H, g => {
  // viale delle Cascine: chiome e recinzione con locandine
  for (let i = 0; i < 9; i++) { const x = i * 58 + 10; r(g, '#5b4032', x + 8, 118, 5, 42); const col = i % 2 ? '#4a8a58' : '#3f7a55', blob = (cx, cy, rad, c) => { for (let j = -rad; j <= rad; j++) { const w = Math.round(Math.sqrt(rad * rad - j * j)); r(g, c, cx - w, cy + j, w * 2, 1); } }; [[3, 112, 13], [20, 110, 14], [11, 100, 13], [-4, 104, 8], [27, 100, 8]].forEach(([dx, y, rad]) => blob(x + dx, y, rad, col)); [[7, 96, 5], [20, 102, 4], [-2, 106, 3]].forEach(([dx, y, rad]) => blob(x + dx, y, rad, '#6da86a')); }
  r(g, '#8b8f94', 0, 144, 512, 1); r(g, '#8b8f94', 0, 158, 512, 1);
  for (let x = 0; x < 512; x += 16) r(g, '#8b8f94', x, 142, 1, 18);
  [[40, C.pink], [176, C.yellow], [300, C.cyan], [430, C.paper]].forEach(([x, col], i) => { r(g, col, x, 138 + i % 2 * 2, 18, 20); r(g, C.ink, x + 3, 142 + i % 2 * 2, 12, 2); r(g, C.ink, x + 5, 146 + i % 2 * 2, 8, 7); });
});
const BG_GROUND = mk(256, 56, g => {
  r(g, '#c4a06c', 0, 0, 256, 16); for (let i = 0; i < 70; i++) r(g, '#ad8a5a', Math.floor(rnd() * 256), Math.floor(rnd() * 16), 2, 1);
  r(g, '#6fa050', 0, 0, 256, 2);
  r(g, '#e3c48c', 0, 16, 256, 2); r(g, '#b5875a', 0, 18, 256, 38);
  for (let i = 0; i < 180; i++) r(g, i % 3 ? '#9f7449' : '#c99a6a', Math.floor(rnd() * 256), 19 + Math.floor(rnd() * 37), 2, 1);
});
const BG_GRASS = mk(256, 56, g => {
  r(g, '#a9b45f', 0, 0, 256, 16); for (let i = 0; i < 90; i++) r(g, i % 2 ? '#c2c070' : '#8c9c4c', Math.floor(rnd() * 256), Math.floor(rnd() * 16), 2, 1);
  r(g, '#d6d28a', 0, 16, 256, 2); r(g, '#7e8e45', 0, 18, 256, 38);
  for (let i = 0; i < 180; i++) r(g, i % 3 ? '#6e7e3a' : '#94a455', Math.floor(rnd() * 256), 19 + Math.floor(rnd() * 37), 2, 1);
});
const SUNSET = ['#2b3a78', '#55478f', '#8a4f9a', '#c9568c', '#ef7a6c', '#f9a85e', '#fcd07a'];
const hex = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16));
const mix = (a, b, t) => { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; };
const SKY = ['#3fb9d6', '#57c3d8', '#7bcfd8', '#a0d9d4', '#c6e2cc', '#e7e6be', '#f8e3a8'];
const BG_CAR_COLS = ['#d65a5a', '#5a7dd6', '#e0b84a', '#4fae8a', '#9a6fce', '#e5e5e5', '#d97a3a'];

/* ========= Livello ========= */
function buildLevel(ph) {
  const L = { solids: [], puddles: [], picks: [], enemies: [], signs: [], bubbles: [], hints: [], bgCars: [], shades: [], waters: [], w: 4600, heat: false, crowdX: 4250, crowdN: 30, ground: BG_GROUND };
  const car = (x, col, w = 54) => L.solids.push({ t: 'car', x, y: GROUND - 26, w, h: 26, col });
  const bar = (x, w = 30) => L.solids.push({ t: 'bar', x, y: GROUND - 14, w, h: 14 });
  const box = (x, h, w = 32) => L.solids.push({ t: 'box', x, y: GROUND - h, w, h });
  const mud = (x, w) => L.puddles.push({ x, w });
  const foe = (kind, x, a, b) => L.enemies.push({ kind, x, y: GROUND - 20, w: 16, h: 20, a, b, dir: -1, alive: true, t: 0 });
  const pick = (x, y) => L.picks.push({ x, y, got: false });
  const arc = (x, y, n = 5, dx = 18, hgt = 30) => { for (let i = 0; i < n; i++) pick(x + i * dx, y - Math.sin(Math.PI * i / (n - 1)) * hgt); };
  const row = (x, y, n, dx = 16) => { for (let i = 0; i < n; i++) pick(x + i * dx, y); };
  const sign = (x, s) => L.signs.push({ x, s });

  if (ph === 1) {
    const cool = (x) => L.solids.push({ t: 'cool', x, y: GROUND - 14, w: 26, h: 14 });
    const shade = (x, w) => L.shades.push({ x, w });
    const water = (x, y = GROUND - 18) => L.waters.push({ x, y, got: false });
    L.w = 3520; L.heat = true; L.ground = BG_GRASS; L.crowdX = 2880; L.crowdN = 46; L.gateX = 3190; L.endX = 3230; L.stage = true;
    sign(150, "38 GRADI ALL'OMBRA");
    water(250); shade(330, 110); row(345, GROUND - 16, 4, 20);
    cool(520); arc(498, GROUND - 26); water(610);
    foe('gelato', 780, 700, 860); arc(750, GROUND - 34, 5, 16, 22);
    water(930); shade(1040, 120); bar(1240); arc(1216, GROUND - 26);
    sign(1140, 'QUALE OMBRA?');
    cool(1340); cool(1366); water(1356, GROUND - 34);
    foe('birra', 1510, 1430, 1590); arc(1480, GROUND - 34, 5, 16, 22);
    water(1660); shade(1740, 100); box(1900, 16); box(1932, 32); box(1964, 16); water(1944, GROUND - 52); row(1908, GROUND - 28, 1); row(1972, GROUND - 28, 1);
    foe('gelato', 2150, 2070, 2230); arc(2120, GROUND - 34, 5, 16, 22);
    water(2290); shade(2370, 130); bar(2570); arc(2546, GROUND - 26);
    sign(2440, 'IL SOLE CALA. FORSE.');
    foe('birra', 2710, 2630, 2790); arc(2680, GROUND - 34, 5, 16, 22);
    water(2860); cool(2960); row(3040, GROUND - 16, 5, 20);
    L.bubbles = [
      { x: 60, s: 'MA QUANTO MANCA A STASERA?' },
      { x: 1000, s: 'OMBRA! OMBRA!' },
      { x: 2060, s: 'SONO DIVENTATO BRODO.' },
